; Stalker2Optimization 1.0, classic shadows
; S.T.A.L.K.E.R. 2: Heart of Chornobyl 2.1

[SystemSettings]
; Shadows: classic shadow maps instead of virtual ones
r.Shadow.Virtual.Enable=0

; Lighting: Lumen off, screen-space ambient occlusion instead
r.Lumen.DiffuseIndirect.Allow=0
r.Lumen.Reflections.Allow=0
r.Lumen.TranslucencyVolume.Enable=0
r.AmbientOcclusionLevels=-1
r.AmbientOcclusionMaxQuality=100
r.AmbientOcclusionRadiusScale=1
r.GenerateMeshDistanceFields=0

; Geometry
r.Nanite.MaxPixelsPerEdge=1.5
r.Nanite.Streaming.StreamingPoolSize=128

; Video memory limits
r.Streaming.PoolSize=512
r.RenderTargetPoolMin=50
r.VT.PoolSizeScale.Group0=0.5
r.VT.PoolSizeScale.Group1=0.2
r.VT.PoolSizeScale.Group3=0.5

; Texture sharpness
r.MipMapLODBias=0
r.MaxAnisotropy=8
r.VT.MaxAnisotropy=8

; Diagnostics, no effect on graphics
memory.logGenericPlatformMemoryStats=0
